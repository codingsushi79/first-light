<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarShare · First Light</title>
<style>:root{color-scheme:dark}body{margin:0;background:#07090f;color:#e6ebf2;font:14px/1.45 system-ui,sans-serif}header{padding:28px 20px 8px;max-width:1100px;margin:auto}h1{margin:0;font-size:26px}p{color:#8a96a8;margin:4px 0}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:16px 20px 40px;max-width:1100px;margin:auto}.c{background:#111620;border:1px solid #1e2633;border-radius:14px;overflow:hidden}.c img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#000}.c div{padding:8px 10px}.c b{display:block}.c small{color:#8a96a8}a{color:#8fd3ff}</style></head>
<body><header><h1>✦ StarShare</h1><p>Astrophotos captured in <a href="https://github.com/codingsushi79/first-light">First Light</a>, the astrophotography simulator. Like, comment and buy prints from inside the game.</p></header><main id="g"></main>
<script>fetch('/api/posts?limit=48').then(r=>r.json()).then(d=>{const g=document.getElementById('g');for(const p of d.posts){const c=document.createElement('div');c.className='c';const im=new Image();im.loading='lazy';im.src='/api/thumb/'+p.id;im.alt=p.title;const t=document.createElement('div');const b=document.createElement('b');b.textContent=p.title;const s=document.createElement('small');s.textContent=p.author+' · ♥ '+p.likes+' · '+(p.target||'');t.append(b,s);c.append(im,t);g.append(c)}if(!d.posts.length)g.textContent='No images yet — be the first to post!'})</script></body></html>
