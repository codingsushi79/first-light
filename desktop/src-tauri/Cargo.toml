[package]
name = "first-light"
version = "0.1.0"
description = "First Light — an astrophotography simulator"
edition = "2021"

[lib]
name = "first_light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
